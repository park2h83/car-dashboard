<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="계기판">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <title>자동차 계기판</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/overlays.css">
  <link rel="stylesheet" href="css/parking.css">
  <link rel="stylesheet" href="css/windshield.css">
  <link rel="stylesheet" href="css/coach.css">
  <link rel="stylesheet" href="css/easy.css">
  <link rel="stylesheet" href="css/progress.css">
  <link rel="stylesheet" href="css/games.css">
  <!-- 테마 스타일: 테마를 추가하면 여기에 한 줄 추가 -->
  <link rel="stylesheet" href="themes/cockpit/theme.css">
  <link rel="stylesheet" href="themes/play/theme.css">
  <link rel="stylesheet" href="themes/classic/theme.css">
  <link rel="stylesheet" href="themes/digital/theme.css">
  <link rel="stylesheet" href="themes/basic/theme.css">
  <link rel="stylesheet" href="themes/racing/theme.css">
  <link rel="stylesheet" href="themes/bus/theme.css">
  <link rel="stylesheet" href="themes/space/theme.css">
  <link rel="stylesheet" href="themes/lcd/theme.css">
  <link rel="stylesheet" href="themes/luxury/theme.css">
  <link rel="stylesheet" href="themes/sport/theme.css">
  <link rel="stylesheet" href="themes/offroad/theme.css">
  <link rel="stylesheet" href="themes/wide/theme.css">
  <link rel="stylesheet" href="themes/neon/theme.css">
  <link rel="stylesheet" href="themes/supercar/theme.css">
  <link rel="stylesheet" href="themes/rosso/theme.css">
  <link rel="stylesheet" href="themes/muscle/theme.css">
  <link rel="stylesheet" href="themes/retro60/theme.css">
  <link rel="stylesheet" href="themes/german/theme.css">
  <link rel="stylesheet" href="themes/british/theme.css">
  <link rel="stylesheet" href="themes/jdm/theme.css">
  <link rel="stylesheet" href="themes/hyper/theme.css">
</head>
<body>
  <div id="app">
    <!-- 앞유리 운전 화면 (js/windshield.js): 켜면 계기판 위에 보인다 -->
    <div id="windshield" hidden></div>

    <!-- 계기판: 선택된 테마가 이 안을 그린다 -->
    <main id="cluster"></main>

    <div id="toast" aria-live="polite"></div>
    <div id="mode-flash" aria-hidden="true"></div>

    <!-- 주차 화면: 위에서 내려다본 주차장 (js/parkview.js) -->
    <div id="parkview" hidden></div>

    <!-- 운전 점수 성적표 (js/scorecard.js) -->
    <!-- 운전 코치: 상황마다 그림 카드로 할 일을 알려 준다 (js/coach.js) -->
    <div id="coach" hidden></div>

    <div id="score-pop" aria-live="polite"></div>
    <div id="scorecard" hidden></div>

    <!-- 쉬운 모드 (js/easy.js): 목적지·더보기 큰 카드 창, 경적 말풍선 -->
    <div id="sheet" hidden></div>
    <div id="honk" aria-hidden="true">📯 빵빵!</div>

    <!-- 아빠 차 따라가기 표시 (js/follow.js), 바늘 맞추기 놀이·시동 쇼·무드등 (js/games.js) -->
    <div id="follow-chip" aria-live="polite"></div>
    <div id="game-banner" hidden></div>
    <div id="start-show" aria-hidden="true"></div>
    <div id="ambient" aria-hidden="true"></div>

    <!-- 테마 고르기 화면 (🎨 테마 버튼으로 연다. 내용은 app.js 가 만든다) -->
    <div id="theme-picker" hidden></div>

    <!-- 운전면허증 만들기 (js/license.js) -->
    <div id="license" hidden></div>

    <!-- 쉬는 시간 화면 / 부모님 설정 (js/rest.js) -->
    <div id="rest" hidden></div>

    <!-- 처음 열 때 이름 정하기 (js/setup.js) -->
    <div id="setup" hidden></div>

    <!-- 운전 조작부: 가운데 버튼들은 js/core/controls.js 의 설정으로 만들어진다 -->
    <section id="controls">
      <div class="ctrl-left">
        <button class="start-btn" data-action="start" type="button">
          <span>ENGINE</span><span>START</span><span>STOP</span>
        </button>
        <div class="gear-selector" role="group" aria-label="기어">
          <button data-gear="P" type="button">P</button>
          <button data-gear="R" type="button">R</button>
          <button data-gear="N" type="button">N</button>
          <button data-gear="D" type="button">D</button>
        </div>
      </div>

      <div class="ctrl-mid">
        <div class="ctrl-quick" id="ctrl-quick"></div>
        <div class="ctrl-tabs" id="ctrl-tabs"></div>
        <div class="ctrl-panel" id="ctrl-panel"></div>
        <!-- 주차할 때 버튼판 자리에 나타나는 핸들 (js/parkview.js) -->
        <div id="steer" hidden></div>
      </div>

      <div class="ctrl-pedals">
        <div class="pedal pedal-brake" data-pedal="brake">브레이크</div>
        <div class="pedal pedal-accel" data-pedal="accel">엑셀</div>
      </div>
    </section>
  </div>

  <!-- 버전 (새 버전이 들어왔는지 확인용, js/version.js) -->
  <div id="version" aria-hidden="true"></div>

  <div id="rotate-hint">📱↻ 아이패드를 가로로 돌려주세요</div>

  <!-- 순서 중요: core → 테마 → app -->
  <script src="js/version.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/signs.js"></script>
  <script src="js/core/road.js"></script>
  <script src="js/core/roadside.js"></script>
  <script src="js/core/weather.js"></script>
  <script src="js/core/traffic.js"></script>
  <script src="js/core/autopilot.js"></script>
  <script src="js/core/score.js"></script>
  <script src="js/core/parking.js"></script>
  <script src="js/core/vehicle.js"></script>
  <script src="js/core/warnings.js"></script>
  <script src="js/core/sound.js"></script>
  <script src="js/core/icons.js"></script>
  <script src="js/core/gauge.js"></script>
  <script src="js/core/scene.js"></script>
  <script src="js/core/info.js"></script>
  <script src="js/core/themes.js"></script>
  <script src="js/core/controls.js"></script>
  <!-- 테마 스크립트: 테마를 추가하면 여기에 한 줄 추가 -->
  <script src="themes/cockpit/theme.js"></script>
  <script src="themes/play/theme.js"></script>
  <script src="themes/classic/theme.js"></script>
  <script src="themes/digital/theme.js"></script>
  <script src="themes/racing/theme.js"></script>
  <script src="themes/bus/theme.js"></script>
  <script src="themes/space/theme.js"></script>
  <script src="themes/lcd/theme.js"></script>
  <script src="themes/luxury/theme.js"></script>
  <script src="themes/sport/theme.js"></script>
  <script src="themes/offroad/theme.js"></script>
  <script src="themes/wide/theme.js"></script>
  <script src="themes/neon/theme.js"></script>
  <script src="themes/supercar/theme.js"></script>
  <script src="themes/rosso/theme.js"></script>
  <script src="themes/muscle/theme.js"></script>
  <script src="themes/retro60/theme.js"></script>
  <script src="themes/german/theme.js"></script>
  <script src="themes/british/theme.js"></script>
  <script src="themes/jdm/theme.js"></script>
  <script src="themes/hyper/theme.js"></script>
  <script src="themes/basic/theme.js"></script>
  <script src="js/license.js"></script>
  <script src="js/rest.js"></script>
  <script src="js/setup.js"></script>
  <script src="js/wheel.js"></script>
  <script src="js/windshield.js"></script>
  <script src="js/prefs.js"></script>
  <script src="js/easy.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/follow.js"></script>
  <script src="js/games.js"></script>
  <script src="js/coach.js"></script>
  <script src="js/parkview.js"></script>
  <script src="js/scorecard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
